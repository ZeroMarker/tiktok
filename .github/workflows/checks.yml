name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -path './douyin/DouyinLiveRecorder' -prune -o -name '*.sh' -type f -print)
