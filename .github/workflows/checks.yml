name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recorder tests
        # curl_cffi：tiktok_extract 取流测试的真实依赖（无它则相关用例自动 skip）。
        # 前端无构建链，其模块图 / 事件绑定 / 静态资源服务也在这套用例里校验
        # （tests/test_webui.py），因此不再有单独的 npm 构建 job。
        run: |
          python -m pip install curl_cffi
          python -m unittest discover -s tests
      - name: Bilibili push tests
        run: python -m unittest discover -s bili/tests
      - name: Shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -name '*.sh' -type f -print)
