<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TikTok 转播 · 文件轮播 · B 站房间管理">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bili推流">
<meta name="msapplication-TileColor" content="#6750a4">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Bili 推流管理</title>
<!--
  无构建链：Lit + @material/web，原生 ESM + 静态 import map，依赖全部来自本目录 vendor/
  （纯本地，无 CDN；与录制中心 webui/vendor/ 同一份文件）。见 docs/adr/0006-bili-webui-lit.md。
-->
<style>
  /* 模块加载前的首屏底色，避免白闪；正式样式在 frontend/styles.js */
  html{background:#f7f8fc;color-scheme:light dark}
  @media (prefers-color-scheme:dark){html{background:#111318}}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
</style>
<script type="importmap">
  {
    "imports": {
      "lit": "./vendor/lit/index.js",
      "lit/": "./vendor/lit/",
      "lit-element": "./vendor/lit-element/lit-element.js",
      "lit-element/": "./vendor/lit-element/",
      "lit-html": "./vendor/lit-html/lit-html.js",
      "lit-html/": "./vendor/lit-html/",
      "@lit/reactive-element": "./vendor/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "./vendor/reactive-element/",
      "@material/web/": "./vendor/material-web/",
      "tslib": "./vendor/tslib/tslib.es6.js"
    }
  }
</script>
</head>
<body>
<bili-app id="app"></bili-app>
<script type="module" src="./frontend/main.js"></script>
</body>
</html>
