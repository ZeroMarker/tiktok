# 由 install-logrotate.sh 渲染后安装到 /etc/livestream-logrotate.conf。
"__PROJECT_ROOT__/logs/*.log" "__PROJECT_ROOT__/bili/logs/*.log" "__RECORDINGS_DIR__/logs/*/*.log" {
    su __LOG_USER__ __LOG_GROUP__
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    compress
    copytruncate
    sharedscripts
    lastaction
        # 带日期的源日志通常只轮转一次；清理后续不再参与轮转的旧压缩备份。
        /usr/bin/find "__PROJECT_ROOT__/logs" "__PROJECT_ROOT__/bili/logs" "__RECORDINGS_DIR__/logs" -type f -name '*.log.*.gz' -mtime +14 -delete
    endscript
}
