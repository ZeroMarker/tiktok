  <style>

ont-size:15px}.modal-box p{margin:0 0 18px;color:var(--muted);word-break:break-all}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{min-width:84px}@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#233141;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;animation:toast-in .18s ease;z-index:60;max-width:80vw}.warn{color:var(--warn)}.install{display:none}.offline .dot{background:var(--red);box-shadow:0 0 12px var(--red)}@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.start-grid,.split{grid-template-columns:1fr}.job{grid-template-columns:38px 1fr}.actions{grid-column:1/-1}.actions button{flex:1}.filter-bar input{width:130px}}@media(max-width:480px){.shell{padding:18px 12px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:20px}header{align-items:flex-start;flex-direction:column}.head-right{align-items:flex-start}.file-row{flex-wrap:wrap}.fmeta{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <style>
    /* Refined control-room layout */
    :root{
      --bg:#07100f;--bg-soft:#0a1514;--panel:#0d1918;--panel2:#101e1c;
      --line:#20302e;--line-strong:#304541;--text:#f0f7f5;--muted:#91a29f;
      --brand:#58e0ad;--brand-strong:#2fc78e;--blue:#73b8ff;--warn:#f5bd62;
      --red:#ff7f8d;--shadow:0 20px 60px rgba(0,0,0,.28);
      --radius:18px;
    }
    *{scrollbar-width:thin;scrollbar-color:#304541 transparent}
    html{background:var(--bg)}
    body{
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 82% -10%,rgba(48,188,137,.13),transparent 68%),
        radial-gradient(700px 480px at -12% 30%,rgba(69,129,160,.09),transparent 70%),
        var(--bg);
      letter-spacing:.005em;
    }
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
    .shell{position:relative;max-width:1240px;padding:38px 28px calc(72px + env(safe-area-inset-bottom))}
    header{margin-bottom:30px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-mark{position:relative;width:44px;height:44px;flex:none;border:1px solid rgba(88,224,173,.34);border-radius:14px;background:linear-gradient(145deg,rgba(88,224,173,.2),rgba(88,224,173,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(28,169,118,.12)}
    .brand-mark:before,.brand-mark:after{content:"";position:absolute;border-radius:50%}
    .brand-mark:before{width:12px;height:12px;left:10px;top:11px;background:var(--brand);box-shadow:12px 10px 0 -3px rgba(88,224,173,.52)}
    .brand-mark:after{width:20px;height:2px;left:11px;bottom:10px;background:rgba(88,224,173,.7);border-radius:3px}
    .eyebrow{margin:0 0 3px;color:var(--brand);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:24px;line-height:1.2;letter-spacing:-.035em}
    .sub{margin-top:6px;font-size:13px}
    .head-right{display:flex;flex-direction:row;align-items:center;gap:9px}
    .status-pill,.clock-pill{height:36px;display:flex;align-items:center;gap:9px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:rgba(13,25,24,.72);backdrop-filter:blur(14px)}
    .online{color:var(--text);font-size:12px;font-weight:650}
    .dot{width:7px;height:7px;animation:pulse 2.4s ease-in-out infinite}
    #clock{color:var(--muted);font-size:12px}
    @keyframes pulse{50%{opacity:.55;box-shadow:0 0 18px var(--brand)}}
    .install{height:36px;padding:0 14px;border-radius:999px}

    .stats{gap:14px}
    .stat,.panel{border-color:var(--line);background:linear-gradient(145deg,rgba(16,30,28,.94),rgba(11,22,21,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.025),var(--shadow)}
    .stat{position:relative;min-height:132px;padding:20px 20px 18px;border-radius:var(--radius);overflow:hidden}
    .stat:after{content:"";position:absolute;width:90px;height:90px;right:-34px;bottom:-44px;border:1px solid rgba(88,224,173,.14);border-radius:50%;box-shadow:0 0 0 16px rgba(88,224,173,.025)}
    .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .stat-label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .stat-icon{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.03em}
    .stat b{font-size:29px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
    .stat-note{display:block;margin-top:8px;color:var(--muted);font-size:11px}
    .bar{height:4px;margin-top:12px;background:#1a2927}
    .bar i{border-radius:inherit;box-shadow:0 0 12px rgba(88,224,173,.3)}
    .sysinfo{margin:12px 0 0;padding:0 4px;gap:0}
    .sysinfo span{display:flex;align-items:center;gap:6px}
    .sysinfo span+span:before{content:"";width:3px;height:3px;margin:0 12px;border-radius:50%;background:var(--line-strong)}
    .sysinfo b{font-weight:600}

    .panel{padding:22px;margin-top:18px;border-radius:var(--radius)}
    .panel-title{margin-bottom:18px}
    .title-wrap{display:flex;align-items:center;gap:11px}
    .section-icon{width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:#0b1514;color:var(--brand);font-size:13px;font-weight:800}
    .panel-title h2{font-size:14px;letter-spacing:-.01em}
    .panel-kicker{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:1px}
    .create-panel{position:relative;overflow:hidden}
    .create-panel:after{content:"";position:absolute;right:-80px;top:-100px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(88,224,173,.07),transparent 68%);pointer-events:none}
    input,select,button{min-height:40px;border-color:var(--line);border-radius:10px;background:#091312}
    input::placeholder{color:#647572}
    input:hover,select:hover{border-color:var(--line-strong)}
    input:focus,select:focus{border-color:rgba(88,224,173,.75);box-shadow:0 0 0 3px rgba(88,224,173,.08)}
    button{background:linear-gradient(135deg,var(--brand),#42ce9b);box-shadow:0 7px 20px rgba(36,188,133,.13)}
    button:disabled{cursor:not-allowed;filter:saturate(.25);opacity:.65}
    .secondary{border:1px solid var(--line);background:#152522;color:var(--text);box-shadow:none}
    .secondary:hover{border-color:var(--line-strong);background:#1a2c29}
    .danger{border:1px solid rgba(255,127,141,.15);background:rgba(127,38,50,.32);color:#ffb7c0;box-shadow:none}
    .start-grid{grid-template-columns:160px minmax(220px,1fr) 126px;gap:10px}
    #start-btn{position:relative;z-index:1}
    .hint{display:flex;align-items:center;gap:7px;margin-top:11px}
    .hint:before{content:"i";width:15px;height:15px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:50%;font:700 9px/1 ui-monospace,monospace;color:var(--brand)}

    .filter-bar{gap:7px}
    .filter-bar input{width:190px}
    .filter-bar input,.filter-bar select,.filter-bar button{height:36px;min-height:36px;padding:7px 11px;font-size:12px}
    #chips{margin:-2px 0 12px;gap:7px}
    .chip{padding:4px 10px;border-color:var(--line);background:#0b1615;color:var(--muted)}
    .jobs{gap:9px}
    .job{position:relative;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;padding:15px 16px;border-color:var(--line);border-radius:13px;background:rgba(8,18,17,.76);overflow:hidden}
    .job:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--state-color,var(--line-strong));border-radius:0 3px 3px 0;opacity:.85}
    .job[data-state="active"]{--state-color:var(--brand)}
    .job[data-state="failed"]{--state-color:var(--red)}
    .job:hover{border-color:var(--line-strong);background:rgba(12,24,22,.92)}
    .job.sel{border-color:rgba(88,224,173,.55);box-shadow:inset 0 0 0 1px rgba(88,224,173,.12),0 14px 36px rgba(0,0,0,.22)}
    .logo{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#1a2b29,#10201e);font-size:12px;letter-spacing:.04em}
    .job-main{min-width:0}
    .job-heading{display:flex;align-items:center;gap:9px;min-width:0}
    .job h3{font-size:14px;line-height:1.4}
    .platform-tag{flex:none;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}
    .job-facts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:11px}
    .job-facts span+span:before{content:"·";margin-right:7px;color:#41514e}
    .status{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
    .status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
    .actions{gap:6px}
    .actions button{min-height:34px;padding:7px 10px;font-size:11px;border-radius:8px}
    .empty{padding:40px 20px;border:1px dashed var(--line);border-radius:12px;background:rgba(6,15,14,.35)}
    .empty:before{content:"—";display:block;margin-bottom:5px;color:var(--line-strong);font-size:20px}

    .split{grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:18px}
    .split>.panel{min-width:0;margin-top:18px}
    .log-tools{gap:6px}
    .log-tools input,.log-tools select,.log-tools button{min-height:32px;height:32px}
    .log-tools label{padding:0 5px}
    .mini{padding:5px 9px;border-radius:8px}
    .mini.danger{border-color:rgba(255,127,141,.18);background:rgba(127,38,50,.14);color:#e5b3bb}
    .mini.danger:hover{border-color:rgba(255,127,141,.5);background:rgba(127,38,50,.36);color:#ffb7c0}
    pre{height:370px;border:1px solid #172422;border-radius:12px;background:#050b0a;color:#a9bbb7;line-height:1.65;box-shadow:inset 0 1px 14px rgba(0,0,0,.26)}
    .files{max-height:370px}
    .fgroup{margin-bottom:7px}
    .fgroup-head{min-height:38px;padding:8px 10px;border-color:var(--line);border-radius:10px;background:#091312;box-shadow:none}
    .fgroup-head .count{margin-left:auto}
    .fgroup-body{padding-left:9px}
    .file-row{padding:9px 3px;border-color:#1a2927}
    .file-row .fname a{color:#b7dace}
    .file-row .fname a:hover{color:var(--brand)}

    .modal{background:rgba(1,7,6,.76);backdrop-filter:blur(8px)}
    .modal-box{padding:24px;border-color:var(--line-strong);border-radius:18px;background:#0d1918}
    .modal-box h3{font-size:16px}
    .toast{right:24px;bottom:24px;border-color:var(--line-strong);border-radius:12px;background:#182925;color:var(--text)}
    .offline .status-pill{border-color:rgba(255,127,141,.28)}

    @media(max-width:920px){
      .shell{padding:28px 20px calc(60px + env(safe-area-inset-bottom))}
      .split{grid-template-columns:1fr}
      .split>.panel{margin-top:18px}
      .job{grid-template-columns:42px minmax(0,1fr)}
      .logo{width:42px;height:42px}
      .actions{grid-column:2;justify-content:flex-start;overflow-x:auto;padding-bottom:1px}
      .actions button{flex:0 0 auto}
    }
    @media(max-width:680px){
      header{align-items:flex-start;flex-direction:column}
      .head-right{width:100%;justify-content:flex-start;flex-wrap:wrap}
      .stats{grid-template-columns:1fr 1fr}
      .stat{min-height:116px;padding:16px}
      .stat-top{margin-bottom:14px}
      .start-grid{grid-template-columns:1fr}
      .cookie-row{grid-column:auto}
      .panel-title{align-items:flex-start;flex-direction:column}
      .filter-bar{width:100%}
      .filter-bar input{width:auto;flex:1;min-width:130px}
    }
    @media(max-width:440px){
      .shell{padding:20px 12px calc(48px + env(safe-area-inset-bottom))}
      .brand-mark{width:40px;height:40px}
      h1{font-size:21px}
      .sub{font-size:12px}
      .status-pill,.clock-pill{height:33px;padding:0 11px}
      .stats{gap:8px}
      .stat{min-height:108px;padding:14px;border-radius:14px}
      .stat b{font-size:24px}
      .stat-icon{width:25px;height:25px}
      .stat-note{font-size:10px}
      .sysinfo span+span:before{margin:0 7px}
      .panel{padding:16px;border-radius:15px}
      .job{grid-template-columns:38px minmax(0,1fr);gap:10px;padding:13px 11px}
      .logo{width:38px;height:38px;border-radius:10px}
      .actions{grid-column:1/-1}
      .actions button{flex:1;padding:6px 8px}
      .job-facts .optional{display:none}
      .file-row{flex-wrap:wrap}
      .fmeta{width:100%}
      pre{height:320px}
      .toast{right:12px;bottom:12px;left:12px;max-width:none;text-align:center}
    }
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
    .degraded .status-pill{border-color:rgba(245,189,98,.35)}
    .degraded .dot{background:var(--warn);box-shadow:0 0 12px var(--warn)}
    .sync-status{color:var(--muted);font-size:11px;margin-left:auto}
    #refresh-btn.is-loading{pointer-events:none}
    #refresh-btn.is-loading:before{content:'↻ ';display:inline-block;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:680px){.sync-status{width:100%;margin-left:0}}
  </style>
</head>
<body><main class="shell">
  <header><div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><p class="eyebrow">Live Control</p><h1>直播录制中心</h1><p class="sub">聚合管理跨平台录制任务</p></div></div><div class="head-right"><div class="status-pill"><div class="online"><i class="dot"></i><span id="conn">服务在线</span></div></div><div class="clock-pill"><span id="clock">--:--:--</span></div><button id="install-btn" class="secondary install" type="button">安装应用</button></div></header>
  <section class="stats">
    <div class="stat"><div class="stat-top"><span class="stat-label">正在录制</span><span class="stat-icon">REC</span></div><b id="running">—</b><span class="stat-note">个活动任务</span></div>
    <div class="stat"><div class="stat-top"><span class="stat-label">任务总览</span><span class="stat-icon">ALL</span></div><b id="total">—</b><span class="stat-note">个托管任务</span></div>
    <div class="stat"><div class="stat-top"><span class="stat-label">可用空间</span><span class="stat-icon">SSD</span></div><b id="free">—</b><span class="stat-note">录制目录剩余</span></div>
    <div class="stat"><div class="stat-top"><span class="stat-label">磁盘占用</span><span class="stat-icon">%</span></div><b id="usage">—</b><div class="bar" aria-hidden="true"><i id="diskbar"></i></div></div>
  </section>
  <div class="sysinfo"><span>负载 <b id="load1">—</b></span><span>内存 <b id="mem">—</b></span><span>更新于 <b id="updated">—</b></span><span id="sync-status" class="sync-status" role="status" aria-live="polite">等待同步</span></div>
  <section class="panel create-panel"><div class="panel-title"><div class="title-wrap"><span class="section-icon" aria-hidden="true">＋</span><div><h2>新建录制</h2><span class="panel-kicker">选择平台并输入直播间信息</span></div></div></div><form id="start-form" class="start-grid"><select id="platform" aria-label="选择平台"><option value="tiktok">TikTok</option><option value="douyin">抖音</option><option value="soop">SOOP</option><option value="kick">Kick</option><option value="youtube">YouTube</option><option value="chzzk">CHZZK</option></select><input id="target" required placeholder="TikTok 用户名，如 akane.no.1" aria-label="频道或直播地址"><input id="cookie" class="cookie-row" placeholder="抖音 Cookie 文件路径（仅抖音可选）" aria-label="抖音 Cookie 文件路径" disabled><button id="start-btn">开始录制</button></form><div id="hint" class="hint">输入 TikTok 用户名或完整直播地址。</div></section>
  <section class="panel"><div class="panel-title"><div class="title-wrap"><span class="section-icon" aria-hidden="true">●</span><div><h2>录制任务<span id="job-count" class="count"></span></h2><span class="panel-kicker">实时状态与进程控制</span></div></div><div class="filter-bar"><input id="job-q" placeholder="搜索频道…" aria-label="搜索任务"><select id="state-filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="active">运行中</option><option value="failed">失败</option><option value="inactive">已停止</option></select><button id="refresh-btn" class="secondary" type="button">刷新</button></div></div><div id="chips"></div><div id="jobs" class="jobs"><div class="empty">正在加载…</div></div></section>
  <section class="split"><div class="panel"><div class="panel-title"><div class="title-wrap"><span class="section-icon" aria-hidden="true">›_</span><div><h2 id="log-title">任务日志</h2><span class="panel-kicker">Journal 实时输出</span></div></div><div class="log-tools"><label><input id="auto-log" type="checkbox" checked> 自动刷新</label><select id="log-tail" aria-label="日志行数"><option value="200">200 行</option><option value="1000">1000 行</option><option value="5000">5000 行</option></select><button id="wrap-btn" class="mini secondary" type="button">不换行</button><button class="mini secondary" onclick="clearLogs()">清空</button><button class="mini secondary" onclick="copyLogs()">复制</button></div></div><pre id="logs">选择任务的“日志”查看最近 200 行。</pre></div><div class="panel"><div class="panel-title"><div class="title-wrap"><span class="section-icon" aria-hidden="true">□</span><div><h2>录制文件<span id="file-count" class="count"></span></h2><span class="panel-kicker">最近生成的媒体文件</span></div></div><div class="log-tools"><input id="file-q" placeholder="搜索…" aria-label="搜索文件" style="width:110px"><button class="mini secondary" onclick="toggleAllDirs(true)">展开</button><button class="mini secondary" onclick="toggleAllDirs(false)">收起</button></div></div><div id="files" class="files"><div class="empty">暂无文件</div></div></div></section>
</main><div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text"><div class="modal-box"><h3 id="modal-title">确认操作</h3><p id="modal-text"></p><div class="modal-actions"><button id="modal-cancel" class="secondary" type="button">取消</button><button id="modal-ok" class="danger" type="button">确认</button></div></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);const SNAPSHOT_KEY='livestream-webui-snapshot-v1';let selectedUnit='',busy=false,lastJobs=null,offlineState=false,stateFilter='all',jobQuery='',collapsedDirs=new Set(),logRequestId=0;
const hints={tiktok:['TikTok 用户名，如 akane.no.1','输入 TikTok 用户名或完整直播地址。'],douyin:['抖音 web_rid、抖音号或直播 URL','可选 Cookie 文件适用于需要登录态的直播间。'],soop:['SOOP 用户名或直播 URL','输入主播用户名或 play.sooplive.co.kr 地址。'],kick:['Kick 用户名或直播 URL','输入 Kick 频道名或完整地址。'],youtube:['YouTube @handle 或直播 URL','支持频道直播页和具体直播链接。'],chzzk:['CHZZK 频道 ID 或直播 URL','输入频道 ID 或 chzzk.naver.com/live 地址。']};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function attr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function fmtBytes(n){if(!Number.isFinite(+n))return '—';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',2500)}
const PLATFORM_ZH={tiktok:'TikTok',douyin:'抖音',soop:'SOOP',kick:'Kick',youtube:'YouTube',chzzk:'CHZZK'},LOGO_COLORS={tiktok:'#fb7185',douyin:'#f43f5e',soop:'#60a5fa',kick:'#4ade80',youtube:'#f87171',chzzk:'#2dd4bf'};
function stateLabel(s,sub){const m={active:{running:'运行中',activating:'启动中',deactivating:'停止中'},inactive:{dead:'已停止'},failed:{failed:'已失败'}};const t=(m[s]&&m[s][sub]);return t||(s==='failed'?'失败':s)}
function stateClass(s,sub){if(s==='failed')return 'b-bad';if(s==='active')return sub==='running'?'b-good':sub==='activating'?'b-warn':'b-info';if(s==='inactive'||s==='dead')return 'b-muted';if(s==='activating'||s==='deactivating')return 'b-warn';return 'b-info'}
function fmtTime(s){if(!s)return '启动时间未知';const d=new Date(s);return isNaN(d)?s:d.toLocaleString()}
function fmtUptime(s){if(!s)return '';const t=new Date(s).getTime();if(isNaN(t))return '';let sec=Math.max(0,Math.floor((Date.now()-t)/1000));const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);if(d)return `${d}天${h}小时`;if(h)return `${h}小时${m}分`;if(m)return `${m}分钟`;return '刚刚'}
async function api(url,opt={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);const request={...opt,headers:{...(opt.headers||{}),'Content-Type':'application/json'},signal:controller.signal};try{const r=await fetch(url,request);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||r.statusText);return d}catch(e){if(e.name==='AbortError')throw Error('请求超时，请稍后重试');throw e}finally{clearTimeout(timeout)}}
function formatCacheTime(timestamp){if(!timestamp)return '无缓存';const d=new Date(timestamp);return isNaN(d)?'无缓存':d.toLocaleTimeString()}
function cacheSnapshot(jobs,o,fd){try{localStorage.setItem(SNAPSHOT_KEY,JSON.stringify({savedAt:Date.now(),jobs,overview:o,files:fd}))}catch{}}
function renderOverview(o){$('#running').textContent=o.running??'—';$('#total').textContent=o.jobs??'—';$('#free').textContent=fmtBytes(o.disk_free);$('#usage').textContent=(o.disk_percent??'—')+'%';const dp=Number(o.disk_percent)||0;$('#diskbar').style.width=Math.min(100,Math.max(0,dp))+'%';$('#diskbar').style.background=dp>=90?'var(--red)':dp>=75?'var(--warn)':'';$('#usage').style.color=dp>=90?'var(--red)':dp>=75?'var(--warn)':'';$('#updated').textContent=o.server_time?new Date(o.server_time*1000).toLocaleTimeString():'—';$('#load1').textContent=o.load&&o.load[0]!=null?o.load[0].toFixed(2):'—';$('#mem').textContent=o.mem_total?((1-o.mem_available/o.mem_total)*100).toFixed(0)+'%':'—'}
function restoreSnapshot(){try{const snapshot=JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'null');if(!snapshot||!Array.isArray(snapshot.jobs)||!snapshot.overview||!Array.isArray(snapshot.files))return false;lastJobs=snapshot.jobs;window.__files=snapshot.files;window.__filesTotal=snapshot.overview.file_total??snapshot.files.length;renderOverview(snapshot.overview);renderChips(snapshot.overview);renderJobs(lastJobs);renderFiles(window.__files);$('#sync-status').textContent=`缓存于 ${formatCacheTime(snapshot.savedAt)}`;return true}catch{return false}}
function updatePlatform(){const p=$('#platform').value,[ph,h]=hints[p];$('#target').placeholder=ph;$('#hint').textContent=h;$('#cookie').disabled=p!=='douyin';$('#cookie').style.display=p==='douyin'?'block':'none'}$('#platform').onchange=updatePlatform;
function confirmDialog(title,text,okText,cb){$('#modal-title').textContent=title;$('#modal-text').textContent=text;$('#modal-ok').textContent=okText||'确认';$('#modal-ok').className='danger';modalCb=cb;$('#modal').classList.remove('hidden');$('#modal-ok').focus()}let modalCb=null;
$('#modal-cancel').onclick=()=>{$('#modal').classList.add('hidden');modalCb=null};$('#modal-ok').onclick=()=>{$('#modal').classList.add('hidden');const cb=modalCb;modalCb=null;if(cb)cb()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){$('#modal').classList.add('hidden');modalCb=null}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')){$('#modal').classList.add('hidden');modalCb=null;$('#modal-cancel').focus()}});
function notifyChanges(jobs){if(!lastJobs)return;const prev={};for(const j of lastJobs)prev[j.unit]=j.state;for(const j of jobs){const old=prev[j.unit];if(old&&old!==j.state){const zh={active:'开始运行',failed:'已失败',inactive:'已停止',activating:'启动中',deactivating:'停止中'}[j.state]||j.state;toast(`${j.target||j.unit} ${zh}`)}}}
function filteredJobs(jobs){const q=jobQuery.trim().toLowerCase();return jobs.filter(j=>{if(stateFilter!=='all'&&j.state!==stateFilter)return false;if(!q)return true;return (j.target+' '+j.platform+' '+j.unit).toLowerCase().includes(q)})}
async function refreshAll(){if(busy)return;busy=true;const refreshButton=$('#refresh-btn');refreshButton.disabled=true;refreshButton.setAttribute('aria-busy','true');refreshButton.classList.add('is-loading');try{const [jobs,o,fd]=await Promise.all([api('api/jobs'),api('api/overview'),api('api/files?limit=300')]);notifyChanges(jobs);lastJobs=jobs;window.__files=fd.files;window.__filesTotal=fd.total;renderOverview(o);renderChips(o);renderJobs(jobs);renderFiles(fd.files);cacheSnapshot(jobs,{...o,file_total:fd.total},fd.files);document.body.classList.remove('degraded');$('#conn').textContent='服务在线';$('#sync-status').textContent=`已同步 ${formatCacheTime(Date.now())}`;if(offlineState)setOffline(false)}catch(e){if(!navigator.onLine){setOffline(true);if(!lastJobs)$('#jobs').innerHTML='<div class="empty warn">离线模式 · 暂无可用缓存</div>';else{$('#sync-status').textContent='离线模式 · 显示缓存';renderJobs(lastJobs);renderFiles(window.__files||[])}}else{document.body.classList.add('degraded');$('#conn').textContent='服务异常';$('#sync-status').textContent=`同步失败 · ${e.message}`;if(!lastJobs)$('#jobs').innerHTML=`<div class="empty warn">${esc(e.message)}</div>`}}finally{busy=false;refreshButton.disabled=false;refreshButton.setAttribute('aria-busy','false');refreshButton.classList.remove('is-loading')}}
function renderChips(o){const el=$('#chips');const names=Object.entries(o.platforms||{}).sort((a,b)=>b[1]-a[1]);el.innerHTML=names.length?names.map(([p,n])=>`<span class="chip">${esc(PLATFORM_ZH[p]||p)} <b style="color:${LOGO_COLORS[p]||'var(--blue)'}">${n}</b></span>`).join(''):''}
function renderJobs(jobs){$('#job-count').textContent=jobs.length?`${filteredJobs(jobs).length}/${jobs.length} 个`:'无任务';const list=filteredJobs(jobs);$('#jobs').innerHTML=list.length?list.map(j=>`<article class="job${j.unit===selectedUnit?' sel':''}" data-state="${attr(j.state)}"><div class="logo" style="color:${LOGO_COLORS[j.platform]||'var(--blue)'}">${esc((j.platform||'?').slice(0,2))}</div><div class="job-main"><div class="job-heading"><h3 class="job-title" tabindex="0" title="${attr(j.target)}${j.started?' · 开始于 '+attr(fmtTime(j.started)):''}" data-job-action="logs" data-unit="${attr(j.unit)}">${esc(j.target)}</h3><span class="platform-tag">${esc(PLATFORM_ZH[j.platform]||j.platform)}</span></div><div class="job-facts"><span class="status ${stateClass(j.state,j.substate)}">${esc(stateLabel(j.state,j.substate))}</span><span>PID ${j.pid||'—'}</span><span>内存 ${fmtBytes(j.memory)}</span>${j.restarts?`<span>重启 ${j.restarts}</span>`:''}${j.state==='active'?`<span>已运行 ${fmtUptime(j.started)}</span>`:`<span class="optional">${esc(fmtTime(j.started))}</span>`}</div></div><div class="actions"><button class="secondary" data-job-action="logs" data-unit="${attr(j.unit)}">日志</button><button class="secondary" data-job-action="copy" data-unit="${attr(j.unit)}">复制名称</button><button class="secondary" data-job-action="restart" data-unit="${attr(j.unit)}">重启</button><button class="danger" data-job-action="stop" data-unit="${attr(j.unit)}">停止</button></div></article>`).join(''):'<div class="empty">当前没有录制任务</div>'}
function renderFiles(files){const el=$('#files');$('#file-count').textContent=files.length?`${files.length}${window.__filesTotal>files.length?'/'+window.__filesTotal:''} 个`:'无文件';const q=$('#file-q').value.trim().toLowerCase();const shown=q?files.filter(f=>(f.name+' '+f.dir).toLowerCase().includes(q)):files;if(!shown.length){el.innerHTML='<div class="empty">'+(q?'无匹配文件':'暂无录制文件')+'</div>';return}const groups=[];const map={};for(const f of shown){const key=f.dir||'';if(!map[key]){map[key]={dir:f.dir,name:f.dir||'根目录',files:[]};groups.push(map[key])}map[key].files.push(f)}el.innerHTML=groups.map(g=>{const open=!collapsedDirs.has(g.dir);return `<div class="fgroup${open?' open':''}"><button class="fgroup-head" data-file-action="toggle-dir" data-dir="${attr(g.dir)}"><span class="chevron">▶</span><span>${esc(g.name)}</span><span class="count">${g.files.length} 个文件</span></button><div class="fgroup-body">${g.files.map(f=>`<div class="file-row"><div class="fname" title="${attr(f.path)}"><a href="${attr('api/file?path='+encodeURIComponent(f.path))}" download>${esc(f.name)}</a></div><div class="fmeta">${fmtBytes(f.size)} · ${new Date(f.modified*1000).toLocaleString()}</div><button class="mini danger" data-file-action="delete" data-path="${attr(f.path)}">删除</button></div>`).join('')}</div></div>`}).join('')}
function toggleDir(dir){if(collapsedDirs.has(dir))collapsedDirs.delete(dir);else collapsedDirs.add(dir);if(window.__files)renderFiles(window.__files)}
function toggleAllDirs(open){collapsedDirs=new Set(open?[]:[...(window.__files||[]).map(f=>f.dir)]);if(window.__files)renderFiles(window.__files)}
function askDelete(path){const f=(window.__files||[]).find(x=>x.path===path);if(!f)return;confirmDialog('删除文件','确定删除「'+f.name+'」吗？此操作不可恢复。','删除',async()=>{try{await api('api/delete',{method:'POST',body:JSON.stringify({path})});toast('文件已删除');await refreshAll()}catch(e){toast(e.message)}})}
async function showLogs(unit){selectedUnit=unit;const requestId=++logRequestId;const parts=unit.split('-');const pf=PLATFORM_ZH[parts[2]]||parts[2]||'?';const rd=parts.length>3?parts.slice(3,-1).join('-'):'';$('#log-title').textContent='任务日志 · '+pf+(rd?' '+rd:'');if(lastJobs)renderJobs(lastJobs);try{const d=await api('api/logs?unit='+encodeURIComponent(unit)+'&tail='+$('#log-tail').value);if(requestId!==logRequestId||selectedUnit!==unit)return;$('#logs').textContent=d.logs||'暂无日志';$('#logs').scrollTop=$('#logs').scrollHeight}catch(e){if(requestId===logRequestId)toast(e.message)}}
function askStop(unit){confirmDialog('停止任务','确定停止此录制任务？当前 MP4 将正常收尾。','停止',async()=>{try{await api('api/stop',{method:'POST',body:JSON.stringify({unit})});toast('停止请求已发送');selectedUnit='';await refreshAll()}catch(e){toast(e.message)}})}
function askRestart(unit){confirmDialog('重启任务','确定重启此录制任务？录制进程将被终止并重新拉起。','重启',async()=>{try{await api('api/restart',{method:'POST',body:JSON.stringify({unit})});toast('重启请求已发送');await refreshAll()}catch(e){toast(e.message)}})}
function runJobAction(el){const unit=el.dataset.unit;const action=el.dataset.jobAction;if(action==='logs')showLogs(unit);else if(action==='copy')copyText(unit);else if(action==='restart')askRestart(unit);else if(action==='stop')askStop(unit)}
$('#jobs').addEventListener('click',e=>{const el=e.target.closest('[data-job-action]');if(el&&$('#jobs').contains(el))runJobAction(el)});$('#jobs').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('.job-title[data-job-action]');if(!el)return;e.preventDefault();runJobAction(el)});
$('#files').addEventListener('click',e=>{const el=e.target.closest('[data-file-action]');if(!el||!$('#files').contains(el))return;if(el.dataset.fileAction==='toggle-dir')toggleDir(el.dataset.dir);else if(el.dataset.fileAction==='delete')askDelete(el.dataset.path)});
async function copyToClipboard(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);return true}const input=document.createElement('textarea');input.value=s;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();const copied=document.execCommand('copy');input.remove();return copied}catch{return false}}
async function copyText(s){toast(await copyToClipboard(s)?'任务名称已复制':'复制失败，请手动选择文本')}async function copyLogs(){toast(await copyToClipboard($('#logs').textContent)?'日志已复制':'复制失败，请手动选择文本')}function clearLogs(){$('#logs').textContent='';toast('日志已清空')}
$('#wrap-btn').onclick=()=>{const pre=$('#logs');pre.classList.toggle('nowrap');$('#wrap-btn').textContent=pre.classList.contains('nowrap')?'换行':'不换行'};
$('#log-tail').onchange=()=>{if(selectedUnit)showLogs(selectedUnit)};
$('#refresh-btn').onclick=()=>refreshAll();
$('#job-q').addEventListener('input',e=>{jobQuery=e.target.value;if(lastJobs)renderJobs(lastJobs)});
$('#state-filter').onchange=e=>{stateFilter=e.target.value;if(lastJobs)renderJobs(lastJobs)};
$('#file-q').addEventListener('input',()=>{if(window.__files)renderFiles(window.__files)});
$('#start-form').onsubmit=async e=>{e.preventDefault();const platform=$('#platform').value,target=$('#target').value.trim();if(lastJobs&&lastJobs.some(j=>j.platform===platform&&(j.target||'').trim().toLowerCase()===target.toLowerCase())){toast('该频道已存在录制任务，请勿重复添加');return}const b=$('#start-btn');b.disabled=true;b.textContent='启动中…';try{const d=await api('api/start',{method:'POST',body:JSON.stringify({platform,target,cookie_file:$('#cookie').value.trim()})});toast('任务已启动');$('#target').value='';selectedUnit=d.unit;await refreshAll();await showLogs(d.unit)}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent='开始录制'}};
setInterval(()=>{refreshAll();if(selectedUnit&&$('#auto-log').checked)showLogs(selectedUnit)},5000);setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString()},1000);updatePlatform();restoreSnapshot();if(!navigator.onLine)setOffline(true);refreshAll();
// ---- PWA：在线状态 / 安装提示 / 服务工作线程 ----
function setOffline(off){off=!!off;if(off===offlineState&&(!off||!document.body.classList.contains('degraded')))return;offlineState=off;document.body.classList.toggle('offline',off);document.body.classList.remove('degraded');$('#conn').textContent=off?'离线':'服务在线';if(off)$('#sync-status').textContent=lastJobs?'离线模式 · 显示缓存':'离线模式 · 等待连接';toast(off?'已进入离线模式 · 当前展示本地缓存数据':'网络已恢复 · 正在刷新数据')}window.addEventListener('offline',()=>setOffline(true));window.addEventListener('online',()=>{setOffline(false);refreshAll()});
let installPrompt=null;$('#install-btn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install-btn').style.display='none'};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install-btn').style.display='inline-block'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('新版本已就绪，请刷新页面生效')})})}).catch(()=>{})})}
</script></body></html>
