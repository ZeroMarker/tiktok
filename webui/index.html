<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>直播录制中心</title>
    <meta name="description" content="直播录制中心 · 后台管理各平台直播录制任务">
    <meta name="theme-color" content="#0b1210">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="录制中心">
    <!--
      无构建链：原生 ESM + 静态 import map，依赖全部来自仓库内 vendor/（纯本地，无 CDN）。
      - vendor/lit*         lit@3.3.3 运行时（单一实例，避免双份 LitElement）
      - vendor/material-web @material/web@2.5.0 组件（Apache-2.0）
      - vendor/tslib        tslib@2.8.1（Material Web 的运行时辅助）
      更新步骤见 webui/vendor/README.md；一致性由 tests/test_webui.py 保证。
    -->
    <style>
      html{background:#0b1210}
      body{margin:0;background:#0b1210;color:#b7f4d5;font:14px/1.5 "Google Sans Text","Noto Sans",Inter,ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "./vendor/lit/index.js",
          "lit/": "./vendor/lit/",
          "lit-element": "./vendor/lit-element/lit-element.js",
          "lit-element/": "./vendor/lit-element/",
          "lit-html": "./vendor/lit-html/lit-html.js",
          "lit-html/": "./vendor/lit-html/",
          "@lit/reactive-element": "./vendor/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "./vendor/reactive-element/",
          "@material/web/": "./vendor/material-web/",
          "tslib": "./vendor/tslib/tslib.es6.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./frontend/main.js"></script>
  </body>
</html>
