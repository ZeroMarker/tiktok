<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>直播录制中心</title>
  <style>
    :root{color-scheme:dark;--bg:#090d12;--panel:#111821;--panel2:#17212c;--line:#273545;--text:#edf5fc;--muted:#8697a8;--brand:#36d399;--blue:#60a5fa;--warn:#fbbf24;--red:#fb7185;--shadow:0 16px 50px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#163148 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:25px;margin:0}.sub{color:var(--muted);margin:4px 0 0}.online{display:flex;align-items:center;gap:8px;color:var(--brand)}.dot{width:9px;height:9px;background:var(--brand);border-radius:50%;box-shadow:0 0 12px var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.panel{padding:20px;margin-top:16px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-title h2{font-size:15px;margin:0}.auth{display:flex;gap:8px;max-width:430px}input,select,button{border:1px solid var(--line);border-radius:9px;background:#0b1118;color:var(--text);font:inherit;padding:10px 12px;outline:none}input:focus,select:focus{border-color:var(--blue)}button{cursor:pointer;font-weight:650;background:var(--brand);color:#05291d;border:0}.secondary{background:#263545;color:var(--text)}.danger{background:#4b1e28;color:#ffb7c2}.start-grid{display:grid;grid-template-columns:150px 1fr 1fr auto;gap:10px}.hint{color:var(--muted);font-size:12px;margin:9px 2px 0}.bar{height:7px;background:#26313e;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--blue));width:0}.jobs{display:grid;gap:10px}.job{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:#0b1118;border:1px solid var(--line);border-radius:11px}.logo{width:42px;height:42px;display:grid;place-items:center;background:#1c2a38;border-radius:10px;font-weight:800;color:var(--blue);text-transform:uppercase}.job h3{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-block;color:var(--brand);margin-right:8px}.actions{display:flex;gap:7px}.empty{text-align:center;color:var(--muted);padding:30px}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.files{max-height:340px;overflow:auto}.file{padding:9px 0;border-bottom:1px solid var(--line)}.file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:11px;color:var(--muted)}pre{height:340px;margin:0;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#070b0f;border-radius:10px;padding:14px;color:#b9c9d7;font:12px/1.6 ui-monospace,monospace}.log-tools{display:flex;gap:8px;align-items:center}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#233141;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none}.warn{color:var(--warn)}@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.start-grid,.split{grid-template-columns:1fr}.auth{max-width:none}.job{grid-template-columns:38px 1fr}.actions{grid-column:1/-1}.actions button{flex:1}}@media(max-width:480px){.shell{padding:18px 12px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:20px}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header><div><h1>直播录制中心</h1><p class="sub">systemd 托管 · 断流重试 · 自动分段</p></div><div class="online"><i class="dot"></i><span id="clock">服务在线</span></div></header>
  <section class="stats">
    <div class="stat"><b id="running">—</b><span>运行中任务</span></div><div class="stat"><b id="total">—</b><span>任务总数</span></div>
    <div class="stat"><b id="free">—</b><span>磁盘可用</span></div><div class="stat"><b id="usage">—</b><span>磁盘使用率</span><div class="bar"><i id="diskbar"></i></div></div>
  </section>
  <section class="panel"><div class="panel-title"><h2>访问认证</h2><span id="auth-status" class="warn">等待认证</span></div><form id="auth-form" class="auth"><input id="auth-token" type="password" autocomplete="current-password" placeholder="访问令牌" style="flex:1"><button>保存并验证</button></form></section>
  <section class="panel"><div class="panel-title"><h2>新建录制</h2></div><form id="start-form" class="start-grid"><select id="platform"><option value="tiktok">TikTok</option><option value="douyin">抖音</option><option value="soop">SOOP</option><option value="kick">Kick</option><option value="youtube">YouTube</option><option value="chzzk">CHZZK</option></select><input id="target" required placeholder="TikTok 用户名，如 akane.no.1"><input id="cookie" placeholder="抖音 Cookie 文件路径（仅抖音可选）" disabled><button id="start-btn">开始录制</button></form><div id="hint" class="hint">输入 TikTok 用户名或完整直播地址。</div></section>
  <section class="panel"><div class="panel-title"><h2>录制任务</h2><button class="secondary" onclick="refreshAll()">刷新</button></div><div id="jobs" class="jobs"><div class="empty">正在加载…</div></div></section>
  <section class="split"><div class="panel"><div class="panel-title"><h2 id="log-title">任务日志</h2><div class="log-tools"><label><input id="auto-log" type="checkbox" checked> 自动刷新</label><button class="secondary" onclick="copyLogs()">复制</button></div></div><pre id="logs">选择任务的“日志”查看最近 200 行。</pre></div><div class="panel"><div class="panel-title"><h2>最近文件</h2></div><div id="files" class="files"><div class="empty">暂无文件</div></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), tokenInput=$('#auth-token'), authStatus=$('#auth-status');let selectedUnit='',busy=false;
const hints={tiktok:['TikTok 用户名，如 akane.no.1','输入 TikTok 用户名或完整直播地址。'],douyin:['抖音 web_rid、抖音号或直播 URL','可选 Cookie 文件适用于需要登录态的直播间。'],soop:['SOOP 用户名或直播 URL','输入主播用户名或 play.sooplive.co.kr 地址。'],kick:['Kick 用户名或直播 URL','输入 Kick 频道名或完整地址。'],youtube:['YouTube @handle 或直播 URL','支持频道直播页和具体直播链接。'],chzzk:['CHZZK 频道 ID 或直播 URL','输入频道 ID 或 chzzk.naver.com/live 地址。']};
tokenInput.value=localStorage.getItem('liveToken')||'';function token(){return tokenInput.value.trim()}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function fmtBytes(n){if(!Number.isFinite(+n))return '—';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',2500)}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Auth-Token':token()};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){authStatus.textContent='认证失败';authStatus.className='warn'}throw Error(d.error||r.statusText)}return d}
function updatePlatform(){const p=$('#platform').value,[ph,h]=hints[p];$('#target').placeholder=ph;$('#hint').textContent=h;$('#cookie').disabled=p!=='douyin'}$('#platform').onchange=updatePlatform;
async function refreshAll(){if(busy)return;busy=true;try{const [jobs,o]=await Promise.all([api('api/jobs'),api('api/overview')]);authStatus.textContent='认证成功';authStatus.className='online';$('#running').textContent=o.running;$('#total').textContent=o.jobs;$('#free').textContent=fmtBytes(o.disk_free);$('#usage').textContent=o.disk_percent+'%';$('#diskbar').style.width=o.disk_percent+'%';$('#clock').textContent='更新 '+new Date(o.server_time*1000).toLocaleTimeString();renderJobs(jobs);renderFiles(o.files)}catch(e){$('#jobs').innerHTML=`<div class="empty warn">${esc(e.message)}</div>`}finally{busy=false}}
function renderJobs(jobs){$('#jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><div class="logo">${esc((j.platform||'?').slice(0,2))}</div><div><h3 title="${esc(j.target)}">${esc(j.target)}</h3><div class="meta"><span class="badge">● ${esc(j.state)} / ${esc(j.substate)}</span>${esc(j.platform)} · PID ${j.pid||'—'} · 内存 ${fmtBytes(j.memory)} · 重启 ${j.restarts}</div><div class="meta">${esc(j.started||'启动时间未知')}</div></div><div class="actions"><button class="secondary" onclick="showLogs('${j.unit}')">日志</button><button class="secondary" onclick="copyText('${j.unit}')">复制名称</button><button class="danger" onclick="stopJob('${j.unit}')">停止</button></div></article>`).join(''):'<div class="empty">当前没有录制任务</div>'}
function renderFiles(files){$('#files').innerHTML=files.length?files.map(f=>`<div class="file"><div class="file-name" title="${esc(f.path)}">${esc(f.name)}</div><div class="file-meta">${fmtBytes(f.size)} · ${new Date(f.modified*1000).toLocaleString()}</div></div>`).join(''):'<div class="empty">暂无录制文件</div>'}
async function showLogs(unit){selectedUnit=unit;$('#log-title').textContent='任务日志 · '+unit.split('-').slice(2,4).join(' ');try{const d=await api('api/logs?unit='+encodeURIComponent(unit));$('#logs').textContent=d.logs||'暂无日志';$('#logs').scrollTop=$('#logs').scrollHeight}catch(e){toast(e.message)}}
async function stopJob(unit){if(!confirm('确定停止此录制任务？当前 MP4 将正常收尾。'))return;try{await api('api/stop',{method:'POST',body:JSON.stringify({unit})});toast('停止请求已发送');selectedUnit='';await refreshAll()}catch(e){toast(e.message)}}
function copyText(s){navigator.clipboard.writeText(s);toast('任务名称已复制')}function copyLogs(){navigator.clipboard.writeText($('#logs').textContent);toast('日志已复制')}
$('#auth-form').onsubmit=async e=>{e.preventDefault();localStorage.setItem('liveToken',token());await refreshAll()};$('#start-form').onsubmit=async e=>{e.preventDefault();const b=$('#start-btn');b.disabled=true;b.textContent='启动中…';try{const d=await api('api/start',{method:'POST',body:JSON.stringify({platform:$('#platform').value,target:$('#target').value.trim(),cookie_file:$('#cookie').value.trim()})});toast('任务已启动');$('#target').value='';selectedUnit=d.unit;await refreshAll();await showLogs(d.unit)}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent='开始录制'}};
setInterval(()=>{refreshAll();if(selectedUnit&&$('#auto-log').checked)showLogs(selectedUnit)},5000);updatePlatform();refreshAll();
</script></body></html>
