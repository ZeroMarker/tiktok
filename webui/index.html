<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>直播录制中心</title>
  <meta name="description" content="直播录制中心 · 后台管理各平台直播录制任务">
  <meta name="theme-color" content="#090d12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="录制中心">
  <style>
    :root{color-scheme:dark;--bg:#090d12;--panel:#111821;--panel2:#17212c;--line:#273545;--text:#edf5fc;--muted:#8697a8;--brand:#36d399;--blue:#60a5fa;--warn:#fbbf24;--red:#fb7185;--shadow:0 16px 50px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#163148 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px calc(60px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:25px;margin:0}.sub{color:var(--muted);margin:4px 0 0}.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}#clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.online{display:flex;align-items:center;gap:8px;color:var(--brand);font-size:13px}.dot{width:9px;height:9px;background:var(--brand);border-radius:50%;box-shadow:0 0 12px var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.sysinfo{display:flex;gap:18px;color:var(--muted);font-size:12px;margin:14px 2px 0;flex-wrap:wrap}.sysinfo b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}.panel{padding:20px;margin-top:16px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}.panel-title h2{font-size:15px;margin:0}.count{color:var(--muted);font-size:12px;font-weight:600;margin-left:6px}input,select,button{border:1px solid var(--line);border-radius:9px;background:#0b1118;color:var(--text);font:inherit;padding:10px 12px;outline:none}input:focus,select:focus{border-color:var(--blue)}button{transition:filter .15s ease,transform .1s ease;cursor:pointer;font-weight:650;background:var(--brand);color:#05291d;border:0}button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.secondary{background:#263545;color:var(--text)}.danger{background:#4b1e28;color:#ffb7c2}.start-grid{display:grid;grid-template-columns:150px 1fr auto;gap:10px}.cookie-row{grid-column:1/-1;display:none}.hint{color:var(--muted);font-size:12px;margin:9px 2px 0}.bar{height:7px;background:#26313e;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--blue));width:0}.jobs{display:grid;gap:10px}.job{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:#0b1118;border:1px solid var(--line);border-radius:11px;transition:border-color .15s,box-shadow .15s}.job.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--shadow)}.job h3{cursor:pointer;transition:color .15s}.job h3:hover{color:var(--brand)}.logo{width:42px;height:42px;display:grid;place-items:center;background:#1c2a38;border-radius:10px;font-weight:800;color:var(--blue);text-transform:uppercase}.job h3{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-block;margin-right:8px}.b-warn{color:var(--warn)}.b-bad{color:var(--red)}.b-good{color:var(--brand)}.b-info{color:var(--blue)}.b-muted{color:var(--muted)}.actions{display:flex;gap:7px}.empty{text-align:center;color:var(--muted);padding:30px}.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter-bar input{width:170px}.filter-bar select{padding:9px 10px}#chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#1c2a38;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}.chip b{color:var(--c);font-weight:800}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.files{max-height:400px;overflow:auto;padding-right:4px}.fgroup{margin-bottom:6px}.fgroup-head{display:flex;align-items:center;gap:8px;width:100%;background:#0d141c;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--text);font-weight:650;text-align:left}.fgroup-head:hover{border-color:var(--blue)}.fgroup-head .chevron{transition:transform .15s;color:var(--muted);font-size:11px;flex:none}.fgroup.open .chevron{transform:rotate(90deg)}.fgroup-body{display:none;padding:2px 4px 2px 10px}.fgroup.open .fgroup-body{display:block}.file-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}.file-row:last-child{border-bottom:0}.file-row .fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-row .fname a{color:var(--blue);text-decoration:none}.file-row .fname a:hover{text-decoration:underline}.fmeta{font-size:11px;color:var(--muted);white-space:nowrap}.mini{padding:5px 10px;font-size:12px;border-radius:7px;background:#263545;color:var(--text);flex:none}.mini.danger{background:#4b1e28;color:#ffb7c2}pre{height:340px;margin:0;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#070b0f;border-radius:10px;padding:14px;color:#b9c9d7;font:12px/1.6 ui-monospace,monospace}pre.nowrap{white-space:pre;word-break:normal}.log-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.log-tools select{width:auto;padding:6px 8px;font-size:12px}.log-tools label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}.log-tools input[type=checkbox]{width:auto}.log-tools .mini{padding:6px 10px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#000a;z-index:50;padding:20px}.modal.hidden{display:none}.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;max-width:430px;width:100%}.modal-box h3{margin:0 0 10px;font-size:15px}.modal-box p{margin:0 0 18px;color:var(--muted);word-break:break-all}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{min-width:84px}@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#233141;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;animation:toast-in .18s ease;z-index:60;max-width:80vw}.warn{color:var(--warn)}.install{display:none}.offline .dot{background:var(--red);box-shadow:0 0 12px var(--red)}@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.start-grid,.split{grid-template-columns:1fr}.job{grid-template-columns:38px 1fr}.actions{grid-column:1/-1}.actions button{flex:1}.filter-bar input{width:130px}}@media(max-width:480px){.shell{padding:18px 12px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:20px}header{align-items:flex-start;flex-direction:column}.head-right{align-items:flex-start}.file-row{flex-wrap:wrap}.fmeta{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body><main class="shell">
  <header><div><h1>直播录制中心</h1><p class="sub">systemd 托管 · 断流重试 · 自动分段</p></div><div class="head-right"><div class="online"><i class="dot"></i><span id="conn">服务在线</span></div><span id="clock">--:--:--</span><button id="install-btn" class="secondary install" type="button">安装应用</button></div></header>
  <section class="stats">
    <div class="stat"><b id="running">—</b><span>运行中任务</span></div><div class="stat"><b id="total">—</b><span>任务总数</span></div>
    <div class="stat"><b id="free">—</b><span>磁盘可用</span></div><div class="stat"><b id="usage">—</b><span>磁盘使用率</span><div class="bar"><i id="diskbar"></i></div></div>
  </section>
  <div class="sysinfo"><span>负载 <b id="load1">—</b></span><span>内存 <b id="mem">—</b></span><span>更新于 <b id="updated">—</b></span></div>
  <section class="panel"><div class="panel-title"><h2>新建录制</h2></div><form id="start-form" class="start-grid"><select id="platform" aria-label="选择平台"><option value="tiktok">TikTok</option><option value="douyin">抖音</option><option value="soop">SOOP</option><option value="kick">Kick</option><option value="youtube">YouTube</option><option value="chzzk">CHZZK</option></select><input id="target" required placeholder="TikTok 用户名，如 akane.no.1" aria-label="频道或直播地址"><input id="cookie" class="cookie-row" placeholder="抖音 Cookie 文件路径（仅抖音可选）" aria-label="抖音 Cookie 文件路径" disabled><button id="start-btn">开始录制</button></form><div id="hint" class="hint">输入 TikTok 用户名或完整直播地址。</div></section>
  <section class="panel"><div class="panel-title"><h2>录制任务<span id="job-count" class="count"></span></h2><div class="filter-bar"><input id="job-q" placeholder="搜索频道…" aria-label="搜索任务"><select id="state-filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="active">运行中</option><option value="failed">失败</option><option value="inactive">已停止</option></select><button class="secondary" onclick="refreshAll()">刷新</button></div></div><div id="chips"></div><div id="jobs" class="jobs" style="margin-top:10px"><div class="empty">正在加载…</div></div></section>
  <section class="split"><div class="panel"><div class="panel-title"><h2 id="log-title">任务日志</h2><div class="log-tools"><label><input id="auto-log" type="checkbox" checked> 自动刷新</label><select id="log-tail" aria-label="日志行数"><option value="200">200 行</option><option value="1000">1000 行</option><option value="5000">5000 行</option></select><button id="wrap-btn" class="mini secondary" type="button">不换行</button><button class="mini secondary" onclick="clearLogs()">清空</button><button class="mini secondary" onclick="copyLogs()">复制</button></div></div><pre id="logs">选择任务的“日志”查看最近 200 行。</pre></div><div class="panel"><div class="panel-title"><h2>录制文件<span id="file-count" class="count"></span></h2><div class="log-tools"><input id="file-q" placeholder="搜索…" aria-label="搜索文件" style="width:110px"><button class="mini secondary" onclick="toggleAllDirs(true)">展开</button><button class="mini secondary" onclick="toggleAllDirs(false)">收起</button></div></div><div id="files" class="files"><div class="empty">暂无文件</div></div></div></section>
</main><div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"><h3 id="modal-title">确认操作</h3><p id="modal-text"></p><div class="modal-actions"><button id="modal-cancel" class="secondary" type="button">取消</button><button id="modal-ok" class="danger" type="button">确认</button></div></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);let selectedUnit='',busy=false,lastJobs=null,offlineState=false,stateFilter='all',jobQuery='',collapsedDirs=new Set();
const hints={tiktok:['TikTok 用户名，如 akane.no.1','输入 TikTok 用户名或完整直播地址。'],douyin:['抖音 web_rid、抖音号或直播 URL','可选 Cookie 文件适用于需要登录态的直播间。'],soop:['SOOP 用户名或直播 URL','输入主播用户名或 play.sooplive.co.kr 地址。'],kick:['Kick 用户名或直播 URL','输入 Kick 频道名或完整地址。'],youtube:['YouTube @handle 或直播 URL','支持频道直播页和具体直播链接。'],chzzk:['CHZZK 频道 ID 或直播 URL','输入频道 ID 或 chzzk.naver.com/live 地址。']};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function attr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function fmtBytes(n){if(!Number.isFinite(+n))return '—';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',2500)}
const PLATFORM_ZH={tiktok:'TikTok',douyin:'抖音',soop:'SOOP',kick:'Kick',youtube:'YouTube',chzzk:'CHZZK'},LOGO_COLORS={tiktok:'#fb7185',douyin:'#f43f5e',soop:'#60a5fa',kick:'#4ade80',youtube:'#f87171',chzzk:'#2dd4bf'};
function stateLabel(s,sub){const m={active:{running:'运行中',activating:'启动中',deactivating:'停止中'},inactive:{dead:'已停止'},failed:{failed:'已失败'}};const t=(m[s]&&m[s][sub]);return t||(s==='failed'?'失败':s)}
function stateClass(s,sub){if(s==='failed')return 'b-bad';if(s==='active')return sub==='running'?'b-good':sub==='activating'?'b-warn':'b-info';if(s==='inactive'||s==='dead')return 'b-muted';if(s==='activating'||s==='deactivating')return 'b-warn';return 'b-info'}
function fmtTime(s){if(!s)return '启动时间未知';const d=new Date(s);return isNaN(d)?s:d.toLocaleString()}
function fmtUptime(s){if(!s)return '';const t=new Date(s).getTime();if(isNaN(t))return '';let sec=Math.max(0,Math.floor((Date.now()-t)/1000));const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);if(d)return `${d}天${h}小时`;if(h)return `${h}小时${m}分`;if(m)return `${m}分钟`;return '刚刚'}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||r.statusText);return d}
function updatePlatform(){const p=$('#platform').value,[ph,h]=hints[p];$('#target').placeholder=ph;$('#hint').textContent=h;$('#cookie').disabled=p!=='douyin';$('#cookie').style.display=p==='douyin'?'block':'none'}$('#platform').onchange=updatePlatform;
function confirmDialog(title,text,okText,cb){$('#modal-title').textContent=title;$('#modal-text').textContent=text;$('#modal-ok').textContent=okText||'确认';$('#modal-ok').className='danger';modalCb=cb;$('#modal').classList.remove('hidden');$('#modal-ok').focus()}let modalCb=null;
$('#modal-cancel').onclick=()=>{$('#modal').classList.add('hidden');modalCb=null};$('#modal-ok').onclick=()=>{$('#modal').classList.add('hidden');const cb=modalCb;modalCb=null;if(cb)cb()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){$('#modal').classList.add('hidden');modalCb=null}});
function notifyChanges(jobs){if(!lastJobs)return;const prev={};for(const j of lastJobs)prev[j.unit]=j.state;for(const j of jobs){const old=prev[j.unit];if(old&&old!==j.state){const zh={active:'开始运行',failed:'已失败',inactive:'已停止',activating:'启动中',deactivating:'停止中'}[j.state]||j.state;toast(`${j.target||j.unit} ${zh}`)}}}
function filteredJobs(jobs){const q=jobQuery.trim().toLowerCase();return jobs.filter(j=>{if(stateFilter!=='all'&&j.state!==stateFilter)return false;if(!q)return true;return (j.target+' '+j.platform+' '+j.unit).toLowerCase().includes(q)})}
async function refreshAll(){if(busy)return;busy=true;try{const [jobs,o,fd]=await Promise.all([api('api/jobs'),api('api/overview'),api('api/files?limit=300')]);notifyChanges(jobs);lastJobs=jobs;window.__files=fd.files;window.__filesTotal=fd.total;$('#running').textContent=o.running;$('#total').textContent=o.jobs;$('#free').textContent=fmtBytes(o.disk_free);$('#usage').textContent=o.disk_percent+'%';const dp=o.disk_percent;$('#diskbar').style.width=dp+'%';$('#diskbar').style.background=dp>=90?'var(--red)':dp>=75?'var(--warn)':'';$('#usage').style.color=dp>=90?'var(--red)':dp>=75?'var(--warn)':'';$('#updated').textContent=new Date(o.server_time*1000).toLocaleTimeString();$('#load1').textContent=o.load&&o.load[0]!=null?o.load[0].toFixed(2):'—';$('#mem').textContent=o.mem_total?((1-o.mem_available/o.mem_total)*100).toFixed(0)+'%':'—';renderChips(o);renderJobs(jobs);renderFiles(fd.files)}catch(e){if(navigator.onLine){$('#jobs').innerHTML=`<div class="empty warn">${esc(e.message)}</div>`}else{setOffline(true);$('#jobs').innerHTML='<div class="empty warn">离线模式 · 显示的是本地缓存数据，网络恢复后自动刷新</div>'}}finally{busy=false}}
function renderChips(o){const el=$('#chips');const names=Object.entries(o.platforms||{}).sort((a,b)=>b[1]-a[1]);el.innerHTML=names.length?names.map(([p,n])=>`<span class="chip">${esc(PLATFORM_ZH[p]||p)} <b style="color:${LOGO_COLORS[p]||'var(--blue)'}">${n}</b></span>`).join(''):''}
function renderJobs(jobs){$('#job-count').textContent=jobs.length?`${filteredJobs(jobs).length}/${jobs.length} 个`:'无任务';const list=filteredJobs(jobs);$('#jobs').innerHTML=list.length?list.map(j=>`<article class="job${j.unit===selectedUnit?' sel':''}"><div class="logo" style="color:${LOGO_COLORS[j.platform]||'var(--blue)'}">${esc((j.platform||'?').slice(0,2))}</div><div><h3 class="job-title" tabindex="0" title="${attr(j.target)}" data-job-action="logs" data-unit="${attr(j.unit)}">${esc(j.target)}</h3><div class="meta"><span class="badge ${stateClass(j.state,j.substate)}">● ${esc(stateLabel(j.state,j.substate))}</span>${esc(PLATFORM_ZH[j.platform]||j.platform)} · PID ${j.pid||'—'} · 内存 ${fmtBytes(j.memory)} · 重启 ${j.restarts}${j.state==='active'?' · 已运行 '+fmtUptime(j.started):''}</div><div class="meta">${esc(fmtTime(j.started))}</div></div><div class="actions"><button class="secondary" data-job-action="logs" data-unit="${attr(j.unit)}">日志</button><button class="secondary" data-job-action="copy" data-unit="${attr(j.unit)}">复制名称</button><button class="secondary" data-job-action="restart" data-unit="${attr(j.unit)}">重启</button><button class="danger" data-job-action="stop" data-unit="${attr(j.unit)}">停止</button></div></article>`).join(''):'<div class="empty">当前没有录制任务</div>'}
function renderFiles(files){const el=$('#files');$('#file-count').textContent=files.length?`${files.length}${window.__filesTotal>files.length?'/'+window.__filesTotal:''} 个`:'无文件';const q=$('#file-q').value.trim().toLowerCase();const shown=q?files.filter(f=>(f.name+' '+f.dir).toLowerCase().includes(q)):files;if(!shown.length){el.innerHTML='<div class="empty">'+(q?'无匹配文件':'暂无录制文件')+'</div>';return}const groups=[];const map={};for(const f of shown){const key=f.dir||'';if(!map[key]){map[key]={dir:f.dir,name:f.dir||'根目录',files:[]};groups.push(map[key])}map[key].files.push(f)}el.innerHTML=groups.map(g=>{const open=!collapsedDirs.has(g.dir);return `<div class="fgroup${open?' open':''}"><button class="fgroup-head" data-file-action="toggle-dir" data-dir="${attr(g.dir)}"><span class="chevron">▶</span><span>${esc(g.name)}</span><span class="count">${g.files.length} 个文件</span></button><div class="fgroup-body">${g.files.map(f=>`<div class="file-row"><div class="fname" title="${attr(f.path)}"><a href="${attr('api/file?path='+encodeURIComponent(f.path))}" download>${esc(f.name)}</a></div><div class="fmeta">${fmtBytes(f.size)} · ${new Date(f.modified*1000).toLocaleString()}</div><button class="mini danger" data-file-action="delete" data-path="${attr(f.path)}">删除</button></div>`).join('')}</div></div>`}).join('')}
function toggleDir(dir){if(collapsedDirs.has(dir))collapsedDirs.delete(dir);else collapsedDirs.add(dir);if(window.__files)renderFiles(window.__files)}
function toggleAllDirs(open){collapsedDirs=new Set(open?[]:[...(window.__files||[]).map(f=>f.dir)]);if(window.__files)renderFiles(window.__files)}
function askDelete(path){const f=(window.__files||[]).find(x=>x.path===path);if(!f)return;confirmDialog('删除文件','确定删除「'+f.name+'」吗？此操作不可恢复。','删除',async()=>{try{await api('api/delete',{method:'POST',body:JSON.stringify({path})});toast('文件已删除');await refreshAll()}catch(e){toast(e.message)}})}
async function showLogs(unit){selectedUnit=unit;const parts=unit.split('-');const pf=PLATFORM_ZH[parts[2]]||parts[2]||'?';const rd=parts.length>3?parts.slice(3,-1).join('-'):'';$('#log-title').textContent='任务日志 · '+pf+(rd?' '+rd:'');if(lastJobs)renderJobs(lastJobs);try{const d=await api('api/logs?unit='+encodeURIComponent(unit)+'&tail='+$('#log-tail').value);$('#logs').textContent=d.logs||'暂无日志';$('#logs').scrollTop=$('#logs').scrollHeight}catch(e){toast(e.message)}}
function askStop(unit){confirmDialog('停止任务','确定停止此录制任务？当前 MP4 将正常收尾。','停止',async()=>{try{await api('api/stop',{method:'POST',body:JSON.stringify({unit})});toast('停止请求已发送');selectedUnit='';await refreshAll()}catch(e){toast(e.message)}})}
function askRestart(unit){confirmDialog('重启任务','确定重启此录制任务？录制进程将被终止并重新拉起。','重启',async()=>{try{await api('api/restart',{method:'POST',body:JSON.stringify({unit})});toast('重启请求已发送');await refreshAll()}catch(e){toast(e.message)}})}
function runJobAction(el){const unit=el.dataset.unit;const action=el.dataset.jobAction;if(action==='logs')showLogs(unit);else if(action==='copy')copyText(unit);else if(action==='restart')askRestart(unit);else if(action==='stop')askStop(unit)}
$('#jobs').addEventListener('click',e=>{const el=e.target.closest('[data-job-action]');if(el&&$('#jobs').contains(el))runJobAction(el)});$('#jobs').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('.job-title[data-job-action]');if(!el)return;e.preventDefault();runJobAction(el)});
$('#files').addEventListener('click',e=>{const el=e.target.closest('[data-file-action]');if(!el||!$('#files').contains(el))return;if(el.dataset.fileAction==='toggle-dir')toggleDir(el.dataset.dir);else if(el.dataset.fileAction==='delete')askDelete(el.dataset.path)});
function copyText(s){navigator.clipboard.writeText(s);toast('任务名称已复制')}function copyLogs(){navigator.clipboard.writeText($('#logs').textContent);toast('日志已复制')}function clearLogs(){$('#logs').textContent='';toast('日志已清空')}
$('#wrap-btn').onclick=()=>{const pre=$('#logs');pre.classList.toggle('nowrap');$('#wrap-btn').textContent=pre.classList.contains('nowrap')?'换行':'不换行'};
$('#log-tail').onchange=()=>{if(selectedUnit)showLogs(selectedUnit)};
$('#job-q').addEventListener('input',e=>{jobQuery=e.target.value;if(lastJobs)renderJobs(lastJobs)});
$('#state-filter').onchange=e=>{stateFilter=e.target.value;if(lastJobs)renderJobs(lastJobs)};
$('#file-q').addEventListener('input',()=>{if(window.__files)renderFiles(window.__files)});
$('#start-form').onsubmit=async e=>{e.preventDefault();const b=$('#start-btn');b.disabled=true;b.textContent='启动中…';try{const d=await api('api/start',{method:'POST',body:JSON.stringify({platform:$('#platform').value,target:$('#target').value.trim(),cookie_file:$('#cookie').value.trim()})});toast('任务已启动');$('#target').value='';selectedUnit=d.unit;await refreshAll();await showLogs(d.unit)}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent='开始录制'}};
setInterval(()=>{refreshAll();if(selectedUnit&&$('#auto-log').checked)showLogs(selectedUnit)},5000);setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString()},1000);updatePlatform();if(!navigator.onLine)setOffline(true);refreshAll();
// ---- PWA：在线状态 / 安装提示 / 服务工作线程 ----
function setOffline(off){off=!!off;if(off===offlineState)return;offlineState=off;document.body.classList.toggle('offline',off);$('#conn').textContent=off?'离线':'服务在线';toast(off?'已进入离线模式 · 当前展示本地缓存数据':'网络已恢复 · 正在刷新数据')}window.addEventListener('offline',()=>setOffline(true));window.addEventListener('online',()=>setOffline(false));
let installPrompt=null;$('#install-btn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install-btn').style.display='none'};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install-btn').style.display='inline-block'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('新版本已就绪，请刷新页面生效')})})}).catch(()=>{})})}
</script></body></html>
